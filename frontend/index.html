<!doctype html>
<html lang="en" class="dark bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <!-- Storefront <head> (title, description, favicon, OG) is injected here from
         the store-wide General Settings singleton: in dev by the Vite
         `storefront-head` plugin, in prod by the backend serveStorefront
         middleware. Both replace this marker, so it never reaches the browser. -->
    <!--SF_HEAD-->
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var t = localStorage.getItem("theme")
          var dark =
            t === "dark" ||
            (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches) ||
            (t !== "light" && t !== "system")
          document.documentElement.classList.toggle("dark", dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
